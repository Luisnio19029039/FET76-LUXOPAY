name: Compilar FET76 VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release

      - name: Subir el VST3
        uses: actions/upload-artifact@v4
        with:
          name: FET76-VST3-Windows
          path: build/FET76_artefacts/Release/VST3/
